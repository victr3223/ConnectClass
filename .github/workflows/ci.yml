name: ConnectClass CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      mysql:
        image: mysql:8.4
        env:
          # Public fixture credentials for this disposable job only, not deployment secrets.
          MYSQL_ROOT_PASSWORD: ci-root-fixture-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: tcc1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tcc1/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Prepare isolated MySQL schemas and least-privilege test account
        run: node scripts/setup-ci-db.js
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: connectclass_test
          DB_USER: root
          DB_PASSWORD: ci-root-fixture-only
          CI_DB_PASSWORD: ci-app-fixture-only
      - run: npm run check
      - run: npm run test:coverage
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: connectclass_test
          DB_USER: connectclass_test
          DB_PASSWORD: ci-app-fixture-only
