name: connectclass
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - ${CONNECTCLASS_MYSQL_ENV_FILE:-.env.docker.mysql}
    environment:
      MYSQL_DATABASE: connectclass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/01-accounts.sh:/docker-entrypoint-initdb.d/01-accounts.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D connectclass -Nse 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 30
    networks: [database]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  app:
    image: connectclass-app:local
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - ${CONNECTCLASS_APP_ENV_FILE:-.env.docker.app}
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: connectclass
      DB_SSL: "false"
      HOST: 0.0.0.0
      PORT: ${PORT:-8081}
      NODE_ENV: ${APP_NODE_ENV:-development}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8081}:${PORT:-8081}"
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "node", "scripts/docker-healthcheck.js"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 6
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    networks: [database, web]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  mysql_data:
networks:
  web:
  database:
    internal: true
